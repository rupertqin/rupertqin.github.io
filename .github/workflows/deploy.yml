name: Deploy

# 一次构建，三处发布（同一份 dist）：
#   1. GitHub Pages（用户站点根路径 rupertqin.github.io）——纯静态
#   2. Cloudflare Workers Static Assets（gantz.host 主入口）——assets-only，
#      无 Worker 脚本，所有请求走静态资源（免费不限量）
#   3. Cloudflare Pages（qinxiang-site.pages.dev，备用/对照）
# 三处的 /typography 都落到 public/typography/index.html 跳转页（不做反代）。
#
# 合并前这三处分别由 deploy.yml 与 deploy-cloudflare.yml 各构建一次；现在 build
# 只跑一次，两个部署通道并行消费同一份 artifact，避免「一个入口新版、一个旧版」。
#
# 需要的仓库 Secrets：
#   CLOUDFLARE_API_TOKEN  —— 权限：Workers Scripts:Edit、Cloudflare Pages:Edit、Account Settings:Read
#   CLOUDFLARE_ACCOUNT_ID —— Cloudflare 控制台右侧栏的 Account ID
# GH Pages 需要仓库 Settings → Pages → Source = "GitHub Actions"。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  PAGES_PROJECT: qinxiang-site

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # 版本由 package.json 的 packageManager 决定，勿再写 version（会与 packageManager 冲突）

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build with Astro
        run: pnpm build

      - name: Verify static output
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/_headers
          # 纯静态通道的兜底跳转页（Workers 通道由 worker 反代，不命中它）
          test -f dist/typography/index.html
          if [ -f dist/_worker.js ] || [ -f dist/_routes.json ]; then
            echo "::error::检测到 SSR 适配器产物（dist/_worker.js 或 dist/_routes.json），三个通道都需要纯静态产物"
            exit 1
          fi
          echo "dist 文件数: $(find dist -type f | wc -l)"

      - name: Upload artifact for Cloudflare
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-github-pages:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Pages 官方要求部署不可被中途取消，与 workflow 级的 cancel-in-progress 分开配
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-cf-static:
    name: Deploy to Cloudflare (Static Assets)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Cloudflare credentials
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::缺少 CLOUDFLARE_API_TOKEN 或 CLOUDFLARE_ACCOUNT_ID，请在仓库 Settings → Secrets and variables → Actions 中配置"
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Deploy
        run: pnpm exec wrangler deploy

  deploy-cf-pages:
    name: Deploy to Cloudflare Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Cloudflare credentials
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::缺少 CLOUDFLARE_API_TOKEN 或 CLOUDFLARE_ACCOUNT_ID，请在仓库 Settings → Secrets and variables → Actions 中配置"
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # 项目已存在时命令会报错（退出码非 0），在此忽略即可
      - name: Ensure Pages project exists
        run: pnpm exec wrangler pages project create "$PAGES_PROJECT" --production-branch=main || true

      - name: Deploy
        run: pnpm exec wrangler pages deploy dist --project-name="$PAGES_PROJECT" --branch=main --commit-dirty=true
