name: Deploy to Cloudflare

# 静态资源 + 子功能反代双通道发布：
#   - Workers Static Assets（主入口，qinxiang-site.<子域>.workers.dev）：worker/index.js
#     会把 /typography 前缀反代到子项目 typography（Cloudflare Pages）
#   - Cloudflare Pages（备用/对照，qinxiang-site.pages.dev）：纯静态，不执行 Worker，
#     /typography 会落到 public/typography/index.html 的跳转页
# 与 GitHub Pages 流水线（deploy.yml）互不影响。
#
# 需要的仓库 Secrets：
#   CLOUDFLARE_API_TOKEN  —— 权限：Workers Scripts:Edit、Cloudflare Pages:Edit、Account Settings:Read
#   CLOUDFLARE_ACCOUNT_ID —— Cloudflare 控制台右侧栏的 Account ID

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WORKER_NAME: qinxiang-site
  PAGES_PROJECT: qinxiang-site

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # 版本由 package.json 的 packageManager 决定，勿再写 version（会与 packageManager 冲突）

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build with Astro
        run: pnpm build

      # 子功能不在本仓库构建：/typography 由 worker/index.js 反代到 typography
      - name: Check Worker
        run: |
          set -euo pipefail
          test -f worker/index.js
          node --check worker/index.js
          grep -q '"main": "./worker/index.js"' wrangler.jsonc
          grep -q 'typography' wrangler.jsonc
          echo "worker/index.js 语法与 wrangler 配置校验通过"

      - name: Verify static output
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/_headers
          # 纯静态通道的兜底跳转页
          test -f dist/typography/index.html
          if [ -f dist/_worker.js ] || [ -f dist/_routes.json ]; then
            echo "::error::检测到 SSR 适配器产物（dist/_worker.js 或 dist/_routes.json），产物不是纯静态"
            exit 1
          fi
          echo "dist 文件数: $(find dist -type f | wc -l)"

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  deploy-workers:
    name: Deploy to Workers (static assets)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Cloudflare credentials
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::缺少 CLOUDFLARE_API_TOKEN 或 CLOUDFLARE_ACCOUNT_ID，请在仓库 Settings → Secrets and variables → Actions 中配置"
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # 版本由 package.json 的 packageManager 决定，勿再写 version（会与 packageManager 冲突）

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Deploy
        run: pnpm exec wrangler deploy

  deploy-pages:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Cloudflare credentials
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::缺少 CLOUDFLARE_API_TOKEN 或 CLOUDFLARE_ACCOUNT_ID，请在仓库 Settings → Secrets and variables → Actions 中配置"
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # 版本由 package.json 的 packageManager 决定，勿再写 version（会与 packageManager 冲突）

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # 项目已存在时命令会报错（退出码非 0），在此忽略即可
      - name: Ensure Pages project exists
        run: pnpm exec wrangler pages project create "$PAGES_PROJECT" --production-branch=main || true

      - name: Deploy
        run: pnpm exec wrangler pages deploy dist --project-name="$PAGES_PROJECT" --branch=main --commit-dirty=true
